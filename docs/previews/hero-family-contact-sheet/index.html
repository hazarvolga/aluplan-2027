<!doctype html>
<html lang="tr" data-mode="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aluplan Hero Visual Families — Contact Sheet</title>
    <style>
      :root {
        color-scheme: dark;
        --page: #181a1b;
        --surface: #202325;
        --border: #3a4044;
        --text: #f4f6f7;
        --muted: #aeb6bc;
        --accent: #2dd4bf;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--page); color: var(--text); }
      header, main { width: min(1500px, calc(100% - 40px)); margin-inline: auto; }
      header { padding: 48px 0 28px; border-bottom: 1px solid var(--border); }
      h1, h2, p { margin: 0; }
      h1 { font-size: clamp(2rem, 5vw, 4rem); letter-spacing: -.04em; }
      header p { margin-top: 14px; max-width: 75ch; color: var(--muted); line-height: 1.6; }
      main { padding: 36px 0 72px; display: grid; gap: 42px; }
      article { padding: 22px; background: var(--surface); border: 1px solid var(--border); }
      .meta { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
      .meta h2 { font-size: 1.35rem; }
      .status { font: 600 .72rem/1.2 ui-monospace, monospace; letter-spacing: .08em; color: var(--accent); text-transform: uppercase; }
      .status--review { color: #fbbf24; }
      .frames { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 18px; align-items: stretch; }
      .desktop, .mobile { position: relative; overflow: hidden; background: #151718; border: 1px solid #4b5358; isolation: isolate; }
      .desktop { aspect-ratio: 1440 / 520; }
      .mobile { aspect-ratio: 390 / 640; }
      .art { position: absolute; inset: 0; z-index: -2; background-repeat: no-repeat; }
      .desktop .art {
        background-image: var(--desktop);
        background-size: contain;
        background-position: 100% 50%;
        mask-image: linear-gradient(90deg, transparent 0%, transparent 28%, #000 82%, #000 100%);
      }
      .desktop::after {
        content: ""; position: absolute; inset: 0; z-index: -1;
        background: linear-gradient(90deg, #181a1b 0%, rgba(24,26,27,.72) 54%, transparent 100%);
      }
      .copy { position: absolute; left: 4%; top: 50%; width: 46%; transform: translateY(-50%); }
      .copy span { font: 600 .65rem/1.2 ui-monospace, monospace; letter-spacing: .08em; color: var(--accent); }
      .copy strong { display: block; margin-top: 10px; font-size: clamp(1rem, 2.2vw, 2.2rem); line-height: 1.03; }
      .copy p { margin-top: 10px; color: #c8ced2; font-size: clamp(.55rem, 1vw, .95rem); line-height: 1.45; }
      .mobile .art {
        height: 48%;
        background-image: var(--mobile);
        background-size: cover;
        background-position: 50% 50%;
        mask-image: linear-gradient(180deg, #000 0%, #000 62%, transparent 100%);
      }
      .mobile .copy { left: 8%; top: 56%; width: 84%; transform: none; }
      .mobile .copy strong { font-size: 1.15rem; }
      .mobile .copy p { font-size: .7rem; }
      .note { margin-top: 14px; color: var(--muted); font-size: .86rem; line-height: 1.5; }
      @media (max-width: 800px) {
        .frames { grid-template-columns: 1fr; }
        .mobile { width: min(260px, 100%); }
      }
    </style>
  </head>
  <body>
    <header>
      <p class="status">Approval contact sheet · 29.10.2026</p>
      <h1>Hero visual families</h1>
      <p>Bir mevcut aile ve yedi yeni aday. Solda masaüstü `contain/right + horizontal mask`, sağda aynı orijinalden deterministik 4:5 mobil türev gösterilir. Bu sayfa yalnız görsel onay içindir; route entegrasyonu yapılmamıştır.</p>
    </header>
    <main id="families"></main>
    <script>
      const families = [
        ['VF-00', 'Ecosystem overview', 'Ürün ve çözüm katalogları', 'approved-candidate'],
        ['VF-01', 'Building design', 'Onaylı mimari referans', 'existing-approved'],
        ['VF-02', 'Infrastructure and Civil', 'Altyapı, yol, raylı sistem, köprü ve Civil', 'approved-candidate'],
        ['VF-03', 'Construction and fabrication', 'İnşaat planlama, prekast, çelik ve SDS2', 'approved-candidate'],
        ['VF-04', 'Add-ons and technical tools', 'CDS, PythonPart, AX3000 ve Scalypso', 'approved-candidate'],
        ['VF-05', 'Complementary and cloud services', 'Bimplus, bulut ve tamamlayıcı hizmetler', 'separation-review'],
        ['VF-06', 'Training, support and knowledge', 'Eğitim, webinar, Connect, FAQ ve destek', 'approved-candidate'],
        ['VF-07', 'ALLPLAN product platform', 'ALLPLAN, AEC, Basic, Concept, Professional ve Ultimate', 'approved-candidate']
      ];
      const slug = {
        'VF-00':'vf-00-ecosystem-overview',
        'VF-01':'vf-01-building-design',
        'VF-02':'vf-02-infrastructure-civil',
        'VF-03':'vf-03-construction-fabrication',
        'VF-04':'vf-04-addons-technical-tools',
        'VF-05':'vf-05-complementary-cloud',
        'VF-06':'vf-06-training-support-knowledge',
        'VF-07':'vf-07-allplan-product-platform'
      };
      const root = document.querySelector('#families');
      for (const [id, title, scope, status] of families) {
        const name = slug[id];
        const review = status === 'separation-review';
        const article = document.createElement('article');
        article.style.setProperty('--desktop', `url('/public/assets/heroes/families/${name}.jpg')`);
        article.style.setProperty('--mobile', `url('/public/assets/heroes/families/${name}-mobile.jpg')`);
        article.innerHTML = `
          <div class="meta">
            <h2>${id} · ${title}</h2>
            <span class="status ${review ? 'status--review' : ''}">${review ? 'Ayrışma kontrolü' : status.replaceAll('-', ' ')}</span>
          </div>
          <div class="frames">
            <div class="desktop">
              <div class="art"></div>
              <div class="copy"><span>${id} · FAMILY HERO</span><strong>${title}</strong><p>${scope}</p></div>
            </div>
            <div class="mobile">
              <div class="art"></div>
              <div class="copy"><span>${id}</span><strong>${title}</strong><p>${scope}</p></div>
            </div>
          </div>
          ${review ? '<p class="note">Not: VF-05 teknik olarak geçerli; ancak bina-merkezli kompozisyonu VF-07 ile birlikte değerlendirilmelidir. Yeniden üretim yalnız kullanıcı kararıyla yapılır.</p>' : ''}
        `;
        root.append(article);
      }
    </script>
  </body>
</html>
